version: '3.8'
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # Ensure host.docker.internal resolves on Linux (already works on Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:9.5.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

# Usage:
# 1) Start services: docker-compose up -d
# 2) Prometheus UI: http://localhost:9090
# 3) Grafana UI: http://localhost:3000 (admin/admin)
# 4) Add Prometheus data source in Grafana pointing to http://localhost:9090

